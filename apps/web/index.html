<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Boggle Board (iPad Landscape)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="tray">
      <div id="board" class="board" aria-label="Boggle board" role="grid"></div>
    </div>

    <button id="shuffleBtn" class="shuffle" aria-label="Shuffle dice">
      <img id="shuffleIcon" src="assets/shuffle.png" alt="Shuffle" />
    </button>

    <!-- Landscape recommendation removed per user request -->
  </div>

  <script src="script.js" defer></script>
</body>
</html>
